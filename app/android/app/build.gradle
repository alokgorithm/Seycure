apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = null
if (keystorePropertiesFile.exists()) {
    keystoreProperties = new Properties()
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
} else {
    logger.lifecycle('keystore.properties not found - release build will be unsigned.')
}

android {
    namespace "com.arkqube.seycure"
    compileSdkVersion rootProject.ext.compileSdkVersion
    // AGP 8 stopped generating BuildConfig unless asked. PdfUnlockPlugin
    // reads BuildConfig.DEBUG to decide whether PDF unlocking is available
    // before Phase 2 exists, and that has to come from the build rather than
    // from anything shipped in the web bundle, which is compiled in
    // production mode even inside a debug APK.
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.arkqube.seycure"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "2.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing credentials live in android/keystore.properties, which is
    // gitignored. See keystore.properties.example for the expected keys.
    // Without that file the release build still runs, just unsigned.
    signingConfigs {
        release {
            if (keystoreProperties != null) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystoreProperties != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // On-device PDF decryption for Media Scrubber. pdf-lib, used everywhere
    // else in the PDF path, opens an encrypted file but cannot decrypt it, so
    // the standard security handlers have to come from native code. PDFBox is
    // the mature option on Android; it brings font and CMap resources with it,
    // which is most of the APK size it adds.
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    // Play Billing, used directly. Per CLAUDE.md §6.6 no third-party billing
    // SDK: one would receive device identifiers and purchase data, which
    // would have to be declared in Data Safety and contradicts the app's
    // on-device promise. Play plus the package name is the whole identity
    // system - there is no login, no account and no server.
    implementation 'com.android.billingclient:billing:7.1.1'

    // Crash reporting only. The BoM keeps the Firebase versions consistent;
    // adding any other firebase-* artifact here needs a policy decision first,
    // because it changes what the Play Data Safety form has to declare.
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-crashlytics'
}

apply from: 'capacitor.build.gradle'

// Firebase Crashlytics is the only telemetry this app carries. CLAUDE.md §6.5
// rules out analytics of every other kind - no Firebase Analytics, no event
// telemetry - so do not let anything else in through this door.
//
// Both plugins need google-services.json, which is not in the repo because it
// is per-project configuration the owner generates in the Firebase console.
// Without it the build still succeeds and simply ships no crash reporting, so
// a fresh clone works. Drop the file in app/android/app/ to switch it on.
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.lifecycle("google-services.json not found - Crashlytics is disabled for this build.")
}
